<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Hexagonal Engine Outer Shell -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#121824" stroke="url(#engineGrad)" stroke-width="4" />

  <!-- Center Core Engine Box -->
  <rect x="30" y="30" width="40" height="40" rx="8" fill="#0a0d14" stroke="url(#coreGlow)" stroke-width="2.5" />

  <!-- JS Emblem Text -->
  <text x="37" y="58" fill="#f8fafc" font-size="22" font-weight="800" font-family="sans-serif">JS</text>

  <!-- Spark Energy Nodes -->
  <circle cx="50" cy="15" r="3.5" fill="#06b6d4" />
  <circle cx="80" cy="32" r="3.5" fill="#6366f1" />
  <circle cx="80" cy="68" r="3.5" fill="#10b981" />
  <circle cx="50" cy="85" r="3.5" fill="#f59e0b" />
  <circle cx="20" cy="68" r="3.5" fill="#8b5cf6" />
  <circle cx="20" cy="32" r="3.5" fill="#06b6d4" />
</svg>
